<style>

<body>
<header>
  <h1>Obstructed Puzzles</h1>
  <span>exact rational arithmetic</span>
</header>
<div class="main">
  <div class="sidebar">
    <div class="field">
      <label>Angle θ = p / q</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="text" id="theta-p" value="1" style="width:60px;text-align:center;" placeholder="p">
        <span style="color:var(--muted);font-size:18px;line-height:1;">/</span>
        <input type="text" id="theta-q" value="7" style="width:60px;text-align:center;" placeholder="q">
      </div>
      <div class="error" id="error-msg"></div>
    </div>
    <button onclick="compute()">Compute Γ(θ)</button>
    <div id="status"></div>
    <div class="info-block" id="info-block"></div>
    <div class="legend">
      <div class="section-title" style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:3px;margin-bottom:2px;">Legend</div>
      <div class="legend-item"><div class="legend-dot" style="background:#c47a3a"></div><span>θ</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#c8b89a"></div><span>O</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#c8b89a;opacity:0.55"></div><span>O′</span></div>
      <div class="legend-item"><div class="legend-line" style="background:#4a9b8a;height:2px"></div><span>Γ</span></div>
      <div class="legend-item"><div class="legend-line" style="background:#7a6a4a;height:2px"></div><span>Γ′</span></div>
    </div>
    <div class="gamma-list" id="gamma-list"></div>
  </div>
  <div class="canvas-area">
    <div id="svg-wrapper">
      <svg id="main-svg" viewBox="-1.5 -1.5 3 3" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="zoom-controls">
      <button class="zoom-btn" onclick="zoomBy(1.3)" title="zoom in">+</button>
      <button class="zoom-btn" onclick="zoomReset()" title="reset" style="font-size:11px;">⟳</button>
      <button class="zoom-btn" onclick="zoomBy(1/1.3)" title="zoom out">−</button>
    </div>

<script>
// ── Exact rational arithmetic ──────────────────────────────────────────────
function gcd(a, b) {
  a = a < 0n ? -a : a; b = b < 0n ? -b : b;
  while (b) { [a, b] = [b, a % b]; }
  return a;
}
function rat(p, q) {
  // returns {p, q} with q>0 and gcd=1
  if (typeof p === 'number') p = BigInt(Math.round(p));
  if (typeof q === 'number') q = BigInt(Math.round(q));
  if (q === 0n) throw new Error('zero denominator');
  if (q < 0n) { p = -p; q = -q; }
  const g = gcd(p < 0n ? -p : p, q);
  return { p: p / g, q: q / g };
}
const ZERO = rat(0, 1), ONE = rat(1, 1);
function radd(a, b) { return rat(a.p * b.q + b.p * a.q, a.q * b.q); }
function rsub(a, b) { return rat(a.p * b.q - b.p * a.q, a.q * b.q); }
function rmul(a, b) { return rat(a.p * b.p, a.q * b.q); }
function rdiv(a, b) { return rat(a.p * b.q, a.q * b.p); }
function rlt(a, b) { return a.p * b.q < b.p * a.q; }
function rle(a, b) { return a.p * b.q <= b.p * a.q; }
function req(a, b) { return a.p === b.p && a.q === b.q; }
function rmod1(a) {
  // reduce to [0,1)
  let p = ((a.p % a.q) + a.q) % a.q;
  return rat(p, a.q);
}
function rdouble(a) { return rmod1(rat(2n * a.p, a.q)); }
function rstr(a) { return a.q === 1n ? `${a.p}` : `${a.p}/${a.q}`; }
function rtoFloat(a) { return Number(a.p) / Number(a.q); }

// ── t_{p/q}^- and t_{p/q}^+ ───────────────────────────────────────────────
function computeTValues(pn, qn) {
  // pn, qn are BigInts, p/q in lowest terms, 0 <= p/q < 1
  // s_j = floor((j+1)*p/q) - floor(j*p/q)
  const bits = [];
  for (let j = 0n; j < qn; j++) {
    const a = (j + 1n) * pn / qn;  // BigInt floor division
    const b = j * pn / qn;
    bits.push(a - b);  // 0n or 1n
  }
  // N = sum s_j * 2^(q-1-j)
  let N = 0n;
  for (let j = 0n; j < qn; j++) {
    N += bits[Number(j)] * (1n << (qn - 1n - j));
  }
  const denom = (1n << qn) - 1n;
  const theta0 = rat(N, denom);

  // orbit of theta0 under doubling, q distinct points
  const orbit = [];
  let cur = theta0;
  for (let i = 0; i < Number(qn); i++) {
    orbit.push(cur);
    cur = rdouble(cur);
  }

  // sort orbit
  const sorted = [...orbit].sort((a, b) => rlt(a, b) ? -1 : rlt(b, a) ? 1 : 0);

  // find shortest gap (circular)
  let minGap = null, tMinus = null, tPlus = null;
  for (let i = 0; i < sorted.length; i++) {
    const a = sorted[i];
    const b = sorted[(i + 1) % sorted.length];
    let gap;
    if (i + 1 < sorted.length) {
      gap = rsub(b, a);
    } else {
      // wrap: gap = 1 - a + b
      gap = radd(rsub(ONE, a), b);
    }
    if (minGap === null || rlt(gap, minGap)) {
      minGap = gap;
      tMinus = a;
      tPlus = (i + 1 < sorted.length) ? b : sorted[0];
      // tPlus might wrap; keep as fraction in [0,1)
    }
  }
  return { tMinus, tPlus, orbit: sorted, theta0 };
}

// precompute all t values up to q=20
function precomputeAllT(maxQ) {
  const results = [];
  for (let q = 1; q <= maxQ; q++) {
    for (let p = 0; p < q; p++) {
      const g = Number(gcd(BigInt(p), BigInt(q)));
      if (g !== 1) continue; // not lowest terms (skip p=0,q>1 too except p=0,q=1)
      if (p === 0 && q > 1) continue;
      const { tMinus, tPlus, orbit } = computeTValues(BigInt(p), BigInt(q));
      results.push({ p, q, tMinus, tPlus, orbit });
    }
  }
  return results;
}

// find p/q such that theta in [tMinus, tPlus]
function findPQ(theta, allT) {
  for (const entry of allT) {
    const { tMinus, tPlus } = entry;
    // check if theta in [tMinus, tPlus], handling wrap-around
    if (rle(tMinus, tPlus)) {
      if (rle(tMinus, theta) && rle(theta, tPlus)) return entry;
    } else {
      // interval wraps around 0
      if (rle(tMinus, theta) || rle(theta, tPlus)) return entry;
    }
  }
  return null;
}

// ── Geodesic loop helpers ──────────────────────────────────────────────────
// A geodesic loop is an array of rational angles in [0,1), circularly ordered.
// Two loops are equal if one is an even cyclic shift of the other.

function loopKey(angles) {
  // canonical form: all even cyclic shifts, take lexicographically smallest
  // Special case: length-1 loops (2 angles) treat [a,b] and [b,a] as equivalent
  const n = angles.length;
  const strs = angles.map(rstr);
  let best = null;
  for (let shift = 0; shift < n; shift += 2) {
    const s = [];
    for (let i = 0; i < n; i++) s.push(strs[(i + shift) % n]);
    const key = s.join(',');
    if (best === null || key < best) best = key;
  }
  // For length-1 loops, also consider the reverse [b,a] ~ [a,b]
  if (n === 2) {
    const rev = [strs[1], strs[0]].join(',');
    if (best === null || rev < best) best = rev;
  }
  return best;
}

// side of phi relative to loop: count how many loop angles lie in [0, phi).
// phi is on "side A" iff that count is odd. Works for any loop ordering.
function sideOfPoint(phi, loop) {
  let count = 0;
  for (const a of loop) {
    if (rle(ZERO, a) && rlt(a, phi)) count++;
  }
  return (count % 2) === 1;
}

// partition orbit O by loop; returns frozenset-like string key
function partitionKey(loop, orbit) {
  const inside = [], outside = [];
  for (const pt of orbit) {
    if (sideOfPoint(pt, loop)) inside.push(rstr(pt));
    else outside.push(rstr(pt));
  }
  inside.sort(); outside.sort();
  const a = inside.join(','), b = outside.join(',');
  return a < b ? `${a}|${b}` : `${b}|${a}`;
}

function isEssential(loop, orbit) {
  // Derive essentiality from the partition: both sides must have >= 2 points
  const key = partitionKey(loop, orbit);
  const parts = key.split('|');
  const countSide = s => s.length === 0 ? 0 : s.split(',').length;
  return countSide(parts[0]) >= 2 && countSide(parts[1]) >= 2;
}

// ── Two geodesics cross inside disk? ──────────────────────────────────────
// [a,b] and [c,d] are pairs of angles in [0,1). They cross inside the disk
// iff c and d are in different arcs of S^1 \ {a,b}.
function crossesInsideDisk(a, b, c, d) {
  // c and d are on different sides of chord (a,b)?
  // c is "between" a and b going CCW iff a<b: a<c<b; else c>a or c<b
  function between(x, lo, hi) {
    if (rlt(lo, hi)) return rlt(lo, x) && rlt(x, hi);
    else return rlt(lo, x) || rlt(x, hi);
  }
  const cIn = between(c, a, b);
  const dIn = between(d, a, b);
  return cIn !== dIn;
}

// ── Pullback ───────────────────────────────────────────────────────────────
function halfAngle(a, branch) {
  // branch 0: a/2, branch 1: (a+1)/2
  if (branch === 0) return rmod1(rdiv(a, rat(2, 1)));
  else return rmod1(rdiv(radd(a, ONE), rat(2, 1)));
}

function computePullback(loop, theta, phi, startBranch) {
  const n = loop.length;
  // Inner reference chord: theta/2 -- (theta+1)/2
  const refInA = halfAngle(theta, 0);
  const refInB = halfAngle(theta, 1);
  // Outer reference chord: phi/2 -- (phi+1)/2
  const refOutA = halfAngle(phi, 0);
  const refOutB = halfAngle(phi, 1);

  const result = [halfAngle(loop[0], startBranch)];
  const branches = [startBranch];

  for (let i = 0; i < 2 * n; i++) {
    const ai1 = loop[(i + 1) % n];
    const bi = result[i];

    let bi1, chosenBranch;
    if (i % 2 === 0) {
      // even step: choose preimage of a_{i+1} so internal geodesic [b_i, b_{i+1}]
      // does NOT cross internal reference chord [refInA, refInB]
      for (const br of [0, 1]) {
        const candidate = halfAngle(ai1, br);
        if (!crossesInsideDisk(bi, candidate, refInA, refInB)) {
          bi1 = candidate; chosenBranch = br; break;
        }
      }
      if (bi1 === undefined) { bi1 = halfAngle(ai1, 0); chosenBranch = 0; }
    } else {
      // odd step: choose preimage of a_{i+1} so external geodesic [b_i, b_{i+1}]
      // does NOT cross external reference chord [refOutA, refOutB].
      // Degenerate case: if b_i is one of the outer chord endpoints, the crossing
      // check is ill-defined — fall back to using the same branch as the previous step.
      if (req(bi, refOutA) || req(bi, refOutB)) {
        chosenBranch = branches[i];
        bi1 = halfAngle(ai1, chosenBranch);
      } else {
        for (const br of [0, 1]) {
          const candidate = halfAngle(ai1, br);
          if (!crossesInsideDisk(bi, candidate, refOutA, refOutB)) {
            bi1 = candidate; chosenBranch = br; break;
          }
        }
        if (bi1 === undefined) { bi1 = halfAngle(ai1, 0); chosenBranch = 0; }
      }
    }

    // Check if loop closes (b_{i+1} = b_0 at odd i)
    if (i % 2 === 1 && req(bi1, result[0])) {
      return result;
    }

    result.push(bi1);
    branches.push(chosenBranch);
    if (result.length > 4 * n + 4) break;
  }
  return result;
}


  // Exact rational Gaussian elimination and eigenvector solver.
  // M entries are floats (0, 0.5, 1) — convert to rationals for exact arithmetic.
  function rGaussianSolve(A, b) {
    // A is n×n array of rat, b is n-array of rat
    const n = A.length;
    const aug = A.map((row, i) => [...row, b[i]]);
    for (let col = 0; col < n; col++) {
      // Find pivot: first nonzero in column
      let pivRow = -1;
      for (let row = col; row < n; row++) {
        if (aug[row][col].p !== 0n) { pivRow = row; break; }
      }
      if (pivRow < 0) continue;
      [aug[col], aug[pivRow]] = [aug[pivRow], aug[col]];
      const pivVal = aug[col][col];
      for (let j = col; j <= n; j++) aug[col][j] = rdiv(aug[col][j], pivVal);
      for (let row = 0; row < n; row++) {
        if (row === col) continue;
        const factor = aug[row][col];
        if (factor.p === 0n) continue;
        for (let j = col; j <= n; j++)
          aug[row][j] = rsub(aug[row][j], rmul(factor, aug[col][j]));
      }
    }
    return aug.map(row => row[n]);
  }

  function solveEigenvector(M) {
    const n = M.length;
    if (n === 1) return [1];
    // Convert float matrix to rational
    const Mrat = M.map(row => row.map(v => {
      if (v === 0) return ZERO;
      if (v === 1) return ONE;
      // v should be a simple rational — represent as p/q via float
      // M entries are 0, 0.5, 1, 2 etc. from the weight construction
      const denom = 2n;
      return rat(BigInt(Math.round(v * 2)), 2);
    }));

    // Build (M - I), replace last row with sum = n constraint
    const A = Mrat.map((row, i) => row.map((v, j) => rsub(v, i === j ? ONE : ZERO)));
    A[n - 1] = Array.from({length: n}, () => ONE);
    const b = Array.from({length: n}, (_, i) => i === n - 1 ? rat(n, 1) : ZERO);

    let v = rGaussianSolve(A, b);

    // Check if all positive
    const allPos = v.every(x => x.p > 0n);
    if (!allPos) {
      // Try fixing each row in turn
      for (let k = 0; k < n; k++) {
        const A2 = Mrat.map((row, i) => row.map((val, j) => rsub(val, i === j ? ONE : ZERO)));
        A2[k] = Array.from({length: n}, (_, j) => j === k ? ONE : ZERO);
        const b2 = Array.from({length: n}, (_, i) => i === k ? ONE : ZERO);
        const v2 = rGaussianSolve(A2, b2);
        if (v2.every(x => x.p > 0n)) { v = v2; break; }
      }
    }

    // v is an array of rat; normalize so entries are positive integers with gcd = 1.
    // Find LCM of all denominators, then multiply through.
    let lcmDen = 1n;
    for (const x of v) {
      const g = gcd(lcmDen, x.q);
      lcmDen = lcmDen / g * x.q;
    }
    const ints = v.map(x => x.p * (lcmDen / x.q));
    // Now divide by GCD of numerators
    let g = ints[0] < 0n ? -ints[0] : ints[0];
    for (let i = 1; i < ints.length; i++) {
      const a = ints[i] < 0n ? -ints[i] : ints[i];
      g = gcd(g, a);
    }
    return ints.map(x => Number(x / g));
  }


  // For a Gamma_0 loop [a,b], find the unique preimage [c,d] in Gamma_0
  // (among the 4 candidates halfAngle(a,0/1) x halfAngle(b,0/1)),
  // then return [c,d] and its shift by 1/2.
  function gamma0Pullbacks(loop, gamma0Keys) {
    const HALF = rat(1, 2);
    const a = loop[0], b = loop[1];
    const aPres = [halfAngle(a, 0), halfAngle(a, 1)];
    const bPres = [halfAngle(b, 0), halfAngle(b, 1)];
    for (const ha of aPres) {
      for (const hb of bPres) {
        const key = loopKey([ha, hb]);
        if (gamma0Keys.has(key)) {
          const pb0 = [ha, hb];
          const pb1 = [rmod1(radd(ha, HALF)), rmod1(radd(hb, HALF))];
          return [pb0, pb1];
        }
      }
    }
    return []; // shouldn't happen
  }

// ── Main computation ───────────────────────────────────────────────────────
function computeGamma(theta, allT) {
  const entry = findPQ(theta, allT);
  if (!entry) return { error: 'Could not find p/q for this theta (try increasing maxQ)' };

  const { p, q, tMinus, tPlus } = entry;

  // orbit of tMinus under doubling (length q)
  const tOrbit = [];
  let cur = tMinus;
  for (let i = 0; i < q; i++) {
    tOrbit.push(cur);
    cur = rdouble(cur);
  }

  // orbit of theta under doubling
  const thetaOrbit = [];
  let c2 = theta;
  const seen = new Set();
  while (true) {
    const k = rstr(c2);
    if (seen.has(k)) break;
    seen.add(k);
    thetaOrbit.push(c2);
    c2 = rdouble(c2);
  }

  // check if theta is in tOrbit
  const thetaInTOrbit = tOrbit.some(t => req(t, theta)) ||
                        thetaOrbit.some(t => req(t, tMinus));

  // Sort tOrbit circularly: t_0 < t_1 < ... < t_{q-1}
  const tOrbitSorted = [...tOrbit].sort((a, b) => rlt(a, b) ? -1 : rlt(b, a) ? 1 : 0);

  // Gamma_0: loops (t_i, t_{i+1 mod q}) with circularly sorted orbit
  const Gamma0 = [];
  const Gamma0Keys = new Set();
  const Gamma0Parts = new Set();
  for (let i = 0; i < q; i++) {
    const loop = [tOrbitSorted[i], tOrbitSorted[(i + 1) % q]];
    const key = loopKey(loop);
    if (!Gamma0Keys.has(key)) {
      Gamma0Keys.add(key);
      Gamma0.push(loop);
      Gamma0Parts.add(partitionKey(loop, thetaOrbit));
    }
  }

  if (thetaInTOrbit) {
    // Still compute gammaPrime (pullbacks of Gamma0) and oPrime for display
    const gpKeys = new Set(Gamma0Keys);
    const gp = [];
    for (const loop of Gamma0) {
      for (const pb of gamma0Pullbacks(loop, Gamma0Keys)) {
        const key = loopKey(pb);
        if (!gpKeys.has(key)) { gpKeys.add(key); gp.push(pb); }
      }
    }
    const thetaOrbitKeys0 = new Set(thetaOrbit.map(rstr));
    const op = [];
    const opKeys = new Set(thetaOrbitKeys0);
    for (const pt of thetaOrbit) {
      for (const br of [0, 1]) {
        const pre = halfAngle(pt, br);
        const k = rstr(pre);
        if (!opKeys.has(k)) { opKeys.add(k); op.push(pre); }
      }
    }
    // Compute weights/matrix for Gamma = Gamma_0 using the same machinery below
    // (fall through with generations = [Gamma0], no inductive construction needed)
    const generations0 = [Gamma0];
    const gammaLoops0 = Gamma0;
    const gammaKeys0 = Gamma0.map(loopKey);
    const nGamma0 = gammaLoops0.length;
    const gammaParts0 = gammaLoops0.map(loop => partitionKey(loop, thetaOrbit));
    const partToGammaIdx0 = new Map();
    for (let i = 0; i < nGamma0; i++) {
      if (!partToGammaIdx0.has(gammaParts0[i])) partToGammaIdx0.set(gammaParts0[i], []);
      partToGammaIdx0.get(gammaParts0[i]).push(i);
    }
    let M0 = Array.from({length: nGamma0}, () => new Array(nGamma0).fill(0));
    for (let j = 0; j < nGamma0; j++) {
      const loop = gammaLoops0[j];
      const pbs = gamma0Pullbacks(loop, Gamma0Keys);
      const srcLen = loop.length;
      const seenPbKeys = new Set(); const dedupPbs = [];
      for (const pb of pbs) { const k2 = loopKey(pb); if (!seenPbKeys.has(k2)) { seenPbKeys.add(k2); dedupPbs.push(pb); } }
      let weightPer;
      if (dedupPbs.length === 2 && dedupPbs[0].length === srcLen) weightPer = 1.0;
      else if (dedupPbs.length === 1 && dedupPbs[0].length === 2 * srcLen) weightPer = 0.5;
      else weightPer = dedupPbs.length > 0 ? 1.0 / dedupPbs.length : 0;
      for (const pb of dedupPbs) {
        const pbKey = loopKey(pb);
        const pbPk = partitionKey(pb, thetaOrbit);
        // In early return, Gamma = Gamma_0 only, so all pbs route to themselves if in Gamma
        if (gammaKeys0.includes(pbKey)) {
          M0[gammaKeys0.indexOf(pbKey)][j] += weightPer;
        }
        // (No Gamma\Gamma_0 loops exist in early return case)
      }
    }
    let weights0, multiplicity0;
    const mSum0 = M0.reduce((s, row) => s + row.reduce((a, b) => a + b, 0), 0);
    if (mSum0 < 1e-12) { weights0 = gammaLoops0.map(() => 1); multiplicity0 = 1; }
    else {
      const v0 = solveEigenvector(M0);
      weights0 = v0;
      // In early return Gamma = Gamma_0, so all loops are Gamma_0 loops; use index 0
      multiplicity0 = v0[0];
    }
    return { p, q, tMinus, tPlus, tOrbit, thetaOrbit, theta,
             generations: generations0, stopped: 'theta_in_orbit', gammaPrime: gp, oPrime: op,
             weights: weights0, multiplicity: multiplicity0, matrix: M0,
             gammaPrimeAll: (() => {
               const gpa = [];
               const gpKeys = new Set();
               for (const loop of Gamma0) {
                 const srcKey = loopKey(loop);
                 for (const pb of gamma0Pullbacks(loop, Gamma0Keys)) {
                   const key = loopKey(pb);
                   if (!gpKeys.has(key)) { gpKeys.add(key); gpa.push({loop: pb, key, srcKey, k: 1}); }
                 }
               }
               return gpa;
             })() };
  }

  // Inductive construction
  const generations = [Gamma0];
  // allKeys tracks all loop keys (for deduplication within a generation)
  const allKeys = new Set(Gamma0Keys);
  // inductiveParts tracks partitions of Gamma_m for m >= 1 only
  // (isotopy to Gamma_0 is allowed for n >= 1 pullbacks)
  const inductiveParts = new Set();

  // Gamma_1: special case — pullbacks of Gamma_0 loops [a,b] are [a/2,b/2] and [(a+1/2),(b+1/2)]
  {
    const nextGen = [], nextKeys = new Set(), nextParts = new Set();
    for (const loop of Gamma0) {
      for (const pb of gamma0Pullbacks(loop, Gamma0Keys)) {
        const key = loopKey(pb);
        if (!isEssential(pb, thetaOrbit)) continue;
        if (Gamma0Keys.has(key)) continue;
        const pKey = partitionKey(pb, thetaOrbit);
        if (inductiveParts.has(pKey)) continue;
        if (nextParts.has(pKey)) continue;
        if (!nextKeys.has(key) && !allKeys.has(key)) {
          nextGen.push(pb); nextKeys.add(key); nextParts.add(pKey); allKeys.add(key);
        }
      }
    }
    // Update inductiveParts after generation is complete
    for (const pKey of nextParts) inductiveParts.add(pKey);
    if (nextGen.length > 0) generations.push(nextGen);
  }

  // Gamma_{n+1} for n >= 1: pullbacks via computePullback
  const MAX_N = 100;
  for (let n = 1; n < MAX_N; n++) {
    if (n >= generations.length) break;
    const prevGen = generations[n];
    const nextGen = [];
    const nextKeys = new Set();
    const nextParts = new Set();

    for (const loop of prevGen) {
      for (const startBranch of [0, 1]) {
        const pb = computePullback(loop, theta, tMinus, startBranch);
        if (!pb || pb.length < 2) continue;

        const key = loopKey(pb);
        // condition 1: essential
        if (!isEssential(pb, thetaOrbit)) continue;
        // condition 2: same loop key as any Gamma_0 loop
        if (Gamma0Keys.has(key)) continue;
        const pKey = partitionKey(pb, thetaOrbit);
        // condition 3: same partition key as any Gamma_m for 1 <= m <= n
        if (inductiveParts.has(pKey)) continue;

        if (!nextKeys.has(key) && !allKeys.has(key) && !nextParts.has(pKey)) {
          nextGen.push(pb);
          nextKeys.add(key);
          nextParts.add(pKey);
          allKeys.add(key);
        }
      }
    }
    // Update inductiveParts after generation is complete
    for (const pKey of nextParts) inductiveParts.add(pKey);
    if (nextGen.length === 0) break;
    generations.push(nextGen);
  }

  // ── Compute Gamma' ──────────────────────────────────────────────────────
  // Gamma' = all pullbacks of all loops in Gamma, both branches, no filtering.
  // Each entry records: { loop, srcKey (key of source loop in Gamma), k (length ratio) }

  const allGammaLoops = []; // {loop, key}
  for (const gen of generations) for (const loop of gen) allGammaLoops.push({loop, key: loopKey(loop)});

  const gammaPrimeKeys = new Set();
  const gammaPrimeAll = []; // {loop, key, srcKey, k}

  // Gamma_0: special-case pullbacks
  for (const loop of Gamma0) {
    const srcKey = loopKey(loop);
    for (const pb of gamma0Pullbacks(loop, Gamma0Keys)) {
      const key = loopKey(pb);
      if (!gammaPrimeKeys.has(key)) {
        gammaPrimeKeys.add(key);
        gammaPrimeAll.push({loop: pb, key, srcKey, k: 1});
      }
    }
  }
  // Gamma_n (n>=1): use computePullback, no filtering
  for (let n = 1; n < generations.length; n++) {
    for (const loop of generations[n]) {
      const srcKey = loopKey(loop);
      const srcLen = loop.length;
      for (const startBranch of [0, 1]) {
        const pb = computePullback(loop, theta, tMinus, startBranch);
        if (!pb || pb.length < 2) continue;
        const key = loopKey(pb);
        const k = pb.length / srcLen;
        if (!gammaPrimeKeys.has(key)) {
          gammaPrimeKeys.add(key);
          gammaPrimeAll.push({loop: pb, key, srcKey, k});
        }
      }
    }
  }

  // gammaPrime = loops in Gamma' not already in Gamma (for display only)
  const allGammaKeys = new Set(allGammaLoops.map(e => e.key));
  const gammaPrime = gammaPrimeAll
    .filter(e => !allGammaKeys.has(e.key))
    .map(e => e.loop);

  // ── Compute O' = preimages of thetaOrbit, minus thetaOrbit itself ─────────
  const thetaOrbitKeys = new Set(thetaOrbit.map(rstr));
  const oPrime = [];
  const oPrimeKeys = new Set(thetaOrbitKeys);
  for (const pt of thetaOrbit) {
    for (const br of [0, 1]) {
      const pre = halfAngle(pt, br);
      const k = rstr(pre);
      if (!oPrimeKeys.has(k)) {
        oPrimeKeys.add(k);
        oPrime.push(pre);
      }
    }
  }

  // ── Eigenvector computation ──────────────────────────────────────────────
  // Build index: partitionKey -> list of Gamma loop indices
  const gammaLoops = allGammaLoops.map(e => e.loop);
  const nGamma = gammaLoops.length;
  const gammaKeys = allGammaLoops.map(e => e.key);

  // Partition key for each Gamma loop
  const gammaParts = gammaLoops.map(loop => partitionKey(loop, thetaOrbit));

  // Map from partitionKey -> array of Gamma indices with that partition
  const partToGammaIdx = new Map();
  for (let i = 0; i < nGamma; i++) {
    const pk = gammaParts[i];
    if (!partToGammaIdx.has(pk)) partToGammaIdx.set(pk, []);
    partToGammaIdx.get(pk).push(i);
  }
  // Map partition -> index for Gamma\Gamma_0 loops only (for Map B)
  const gammaNotG0PkToIdx = new Map();
  for (let i = 0; i < nGamma; i++) {
    if (!Gamma0Keys.has(gammaKeys[i]) && !gammaNotG0PkToIdx.has(gammaParts[i])) {
      gammaNotG0PkToIdx.set(gammaParts[i], i);
    }
  }

  let weights, multiplicity;
  let M = Array.from({length: nGamma}, () => new Array(nGamma).fill(0));

  // Build matrix M = B∘A of size nGamma x nGamma
  // Map A: for each Gamma loop j, compute its pullbacks in Gamma'.
  //   - 2 non-equivalent pullbacks of same length: send full weight (1.0) to each
  //   - 1 pullback of doubled length: send half weight (0.5) to it
  // Map B: pb routes to itself if in Gamma; else to Gamma\Gamma_0 loop with same partition.
  for (let j = 0; j < nGamma; j++) {
    const loop = gammaLoops[j];
    const key = gammaKeys[j];
    const srcLen = loop.length;

    // Get pullbacks of this Gamma loop
    let pbsRaw;
    if (Gamma0Keys.has(key)) {
      pbsRaw = gamma0Pullbacks(loop, Gamma0Keys);
    } else {
      pbsRaw = [0, 1].map(sb => computePullback(loop, theta, tMinus, sb))
                     .filter(pb => pb && pb.length >= 2);
    }

    // Deduplicate pullbacks by loop key
    const seenPbKeys = new Set();
    const pbs = [];
    for (const pb of pbsRaw) {
      const pbKey = loopKey(pb);
      if (!seenPbKeys.has(pbKey)) { seenPbKeys.add(pbKey); pbs.push(pb); }
    }

    // Determine weight per pullback
    let weightPer;
    if (pbs.length === 2 && pbs[0].length === srcLen) {
      weightPer = 1.0;
    } else if (pbs.length === 1 && pbs[0].length === 2 * srcLen) {
      weightPer = 0.5;
    } else {
      weightPer = pbs.length > 0 ? 1.0 / pbs.length : 0;
    }

    // Map B: pb routes to itself if in Gamma, else to Gamma\Gamma_0 with same partition
    for (const pb of pbs) {
      const pbKey = loopKey(pb);
      const pbPk = partitionKey(pb, thetaOrbit);
      if (gammaKeys.includes(pbKey)) {
        // pb is in Gamma: route to itself
        M[gammaKeys.indexOf(pbKey)][j] += weightPer;
      } else {
        // pb not in Gamma: route to Gamma\Gamma_0 loop with same partition (if any)
        const i = gammaNotG0PkToIdx.get(pbPk);
        if (i !== undefined) M[i][j] += weightPer;
      }
    }
  }

  const mSum = M.reduce((s, row) => s + row.reduce((a, b) => a + b, 0), 0);
  if (mSum < 1e-12) {
    weights = gammaLoops.map(() => 1);
    multiplicity = 1;
  } else {
    const v = solveEigenvector(M);
    weights = v;
    // Multiplicity = weight of any Gamma_0 loop in the eigenvector
    // (they all have the same weight by symmetry; use index of first Gamma_0 loop)
    const firstG0Idx = gammaKeys.findIndex(k => Gamma0Keys.has(k));
    multiplicity = firstG0Idx >= 0 ? v[firstG0Idx] : Math.max(...v);
  }

  return { p, q, tMinus, tPlus, tOrbit, thetaOrbit, theta, generations, gammaPrime, gammaPrimeAll, oPrime, weights, multiplicity, matrix: M };
}

// ── SVG rendering ──────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function angleToXY(a) {
  // a is rational in [0,1), convert to (x,y) on unit circle
  // Negate sin so that increasing angle goes CCW (SVG y-axis points down)
  const f = rtoFloat(a);
  const rad = 2 * Math.PI * f;
  return [Math.cos(rad), -Math.sin(rad)];
}

// Geodesic arc inside/outside unit disk between two boundary points
function geodesicCircle(p1, p2) {
  const [x1, y1] = p1, [x2, y2] = p2;
  const det = x1 * y2 - x2 * y1;
  if (Math.abs(det) < 1e-10) return null;
  const cx = (y2 - y1) / det;
  const cy = (x1 - x2) / det;
  const r = Math.sqrt((cx - x1) ** 2 + (cy - y1) ** 2);
  return { cx, cy, r };
}

function arcPath(p1, p2, inside) {
  const geo = geodesicCircle(p1, p2);
  if (!geo) return `M ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]}`;
  const { cx, cy, r } = geo;
  const t1 = Math.atan2(p1[1] - cy, p1[0] - cx);
  const t2 = Math.atan2(p2[1] - cy, p2[0] - cx);
  let ccwSpan = t2 - t1;
  if (ccwSpan <= 0) ccwSpan += 2 * Math.PI;
  const tMidA = t1 + ccwSpan / 2;
  const midA = [cx + r * Math.cos(tMidA), cy + r * Math.sin(tMidA)];
  const midAinside = (midA[0] ** 2 + midA[1] ** 2) < 1.0;
  let sweepFlag, largeArcFlag;
  if (midAinside === inside) {
    sweepFlag = 1;
    largeArcFlag = ccwSpan > Math.PI ? 1 : 0;
  } else {
    sweepFlag = 0;
    largeArcFlag = ccwSpan > Math.PI ? 0 : 1;
  }
  return `M ${p1[0]} ${p1[1]} A ${r} ${r} 0 ${largeArcFlag} ${sweepFlag} ${p2[0]} ${p2[1]}`;
}

function drawLoopWithSrc(svg, loop, color, opacity, strokeWidth, srcKey) {
  const n = loop.length;
  for (let i = 0; i < n; i++) {
    const p1 = angleToXY(loop[i]);
    const p2 = angleToXY(loop[(i + 1) % n]);
    const isEven = (i % 2 === 0);
    const d = arcPath(p1, p2, isEven);
    const attrs = {
      d, fill: 'none', stroke: color,
      'stroke-width': strokeWidth,
      'stroke-linecap': 'round',
      opacity: String(opacity),
      class: 'loop-arc prime-arc',
      'data-base-sw': strokeWidth,
      'data-src-key': srcKey
    };
    if (!isEven) attrs['stroke-dasharray'] = '0.04 0.028';
    svg.appendChild(svgEl('path', attrs));
  }
}

function drawLoop(svg, loop, color, opacity, strokeWidth, loopIdx, loopKeyStr) {
  const n = loop.length;
  for (let i = 0; i < n; i++) {
    const p1 = angleToXY(loop[i]);
    const p2 = angleToXY(loop[(i + 1) % n]);
    const isEven = (i % 2 === 0);
    const d = arcPath(p1, p2, isEven);
    const attrs = {
      d, fill: 'none', stroke: color,
      'stroke-width': strokeWidth,
      'stroke-linecap': 'round',
      opacity: String(opacity),
      class: loopIdx !== undefined ? 'loop-arc gamma-arc' : 'loop-arc',
      'data-base-sw': strokeWidth
    };
    if (loopIdx !== undefined) {
      attrs['data-loop-idx'] = String(loopIdx);
      attrs['data-loop-key'] = loopKeyStr || '';
    }
    if (!isEven) attrs['stroke-dasharray'] = '0.04 0.028';
    svg.appendChild(svgEl('path', attrs));
  }
}

function loopCentroid(loop) {
  // Approximate visual centroid of a loop: average of arc midpoints (inside arcs only)
  let sx = 0, sy = 0, count = 0;
  const n = loop.length;
  for (let i = 0; i < n; i += 2) {
    const p1 = angleToXY(loop[i]);
    const p2 = angleToXY(loop[(i+1)%n]);
    // midpoint along the inside arc: use the geodesic circle midpoint
    const geo = geodesicCircle(p1, p2);
    let mx, my;
    if (!geo) { mx = (p1[0]+p2[0])/2; my = (p1[1]+p2[1])/2; }
    else {
      const t1 = Math.atan2(p1[1]-geo.cy, p1[0]-geo.cx);
      const t2 = Math.atan2(p2[1]-geo.cy, p2[0]-geo.cx);
      let ccw = t2 - t1; if (ccw <= 0) ccw += 2*Math.PI;
      const tMid = t1 + ccw/2;
      const midPt = [geo.cx + geo.r*Math.cos(tMid), geo.cy + geo.r*Math.sin(tMid)];
      const midInside = (midPt[0]**2 + midPt[1]**2) < 1;
      const tMidOther = tMid + Math.PI;
      const midOther = [geo.cx + geo.r*Math.cos(tMidOther), geo.cy + geo.r*Math.sin(tMidOther)];
      [mx, my] = midInside ? midPt : midOther;
    }
    sx += mx; sy += my; count++;
  }
  return count > 0 ? [sx/count * 0.55, sy/count * 0.55] : [0, 0];
}

function render(result) {
  const svg = document.getElementById('main-svg');
  while (svg.firstChild) svg.removeChild(svg.lastChild);

  const defs = svgEl('defs', {});
  svg.appendChild(defs);

  // background disk
  svg.appendChild(svgEl('circle', { cx: 0, cy: 0, r: 1, fill: 'rgba(255,255,255,0.03)', stroke: 'none' }));
  // unit circle
  svg.appendChild(svgEl('circle', { cx: 0, cy: 0, r: 1, fill: 'none', stroke: '#3a3a3a', 'stroke-width': '0.018' }));

  if (!result || result.error) return;

  const { theta, tOrbit, thetaOrbit, generations, tMinus, tPlus, gammaPrime, gammaPrimeAll, oPrime, weights } = result;

  // Flatten all Gamma loops in order (matches weights array)
  const allGamma = generations.flat();
  const allGammaKeys = new Set(allGamma.map(loopKey));

  // Draw Gamma' extra loops behind Gamma, tagged with src key
  const gpAll = gammaPrimeAll || [];
  for (const entry of gpAll) {
    if (!allGammaKeys.has(entry.key)) {
      drawLoopWithSrc(svg, entry.loop, '#7a6a4a', 0.45, '0.010', entry.srcKey);
    }
  }

  // Draw all Gamma loops (teal), with loop index for click interaction
  let gammaLoopIdx = 0;
  const gammaLoopKeys = allGamma.map(loopKey);
  if (generations[0]) {
    for (const loop of generations[0]) {
      drawLoop(svg, loop, '#4a9b8a', 0.85, '0.016', gammaLoopIdx, gammaLoopKeys[gammaLoopIdx]);
      gammaLoopIdx++;
    }
  }
  for (let g = 1; g < generations.length; g++) {
    const fade = Math.max(0.35, 0.85 - g * 0.1);
    for (const loop of generations[g]) {
      drawLoop(svg, loop, '#4a9b8a', fade, '0.013', gammaLoopIdx, gammaLoopKeys[gammaLoopIdx]);
      gammaLoopIdx++;
    }
  }
  // Invisible narrow hit-target paths for precise clicking
  for (let idx = 0; idx < allGamma.length; idx++) {
    const loop = allGamma[idx];
    const n = loop.length;
    for (let i = 0; i < n; i++) {
      const p1 = angleToXY(loop[i]);
      const p2 = angleToXY(loop[(i + 1) % n]);
      const isEven = (i % 2 === 0);
      const d = arcPath(p1, p2, isEven);
      const hit = svgEl('path', { d, fill: 'none', stroke: '#000',
        'stroke-width': '0.035', opacity: '0',
        'pointer-events': 'stroke',
        class: 'gamma-arc gamma-hit loop-arc',
        'data-base-sw': '0.035',
        'data-loop-idx': String(idx), 'data-loop-key': gammaLoopKeys[idx] });
      svg.appendChild(hit);
    }
  }





  // O' extra preimage points (smaller, muted gold)
  for (const pt of oPrime) {
    const [px, py] = angleToXY(pt);
    svg.appendChild(svgEl('circle', { cx: px, cy: py, r: '0.020',
      fill: '#c8b89a', opacity: '0.55', class: 'orbit-dot', 'data-base-r': '0.020' }));
  }

  // Orbit of theta: theta itself in coral, rest in gold
  for (let i = 0; i < thetaOrbit.length; i++) {
    const pt = thetaOrbit[i];
    const [px, py] = angleToXY(pt);
    const isTheta = (i === 0);
    const fill = isTheta ? '#c47a3a' : '#c8b89a';
    const baseR = isTheta ? '0.034' : '0.028';
    svg.appendChild(svgEl('circle', { cx: px, cy: py, r: baseR,
      fill, opacity: '0.95', class: 'orbit-dot', 'data-base-r': baseR }));
  }
}

// Keep orbit dots a constant apparent screen size as the user zooms
function updateDotSizes() {
  const svg = document.getElementById('main-svg');
  if (!svg) return;
  const vb = svg.viewBox.baseVal;
  if (!vb || vb.width === 0) return;
  // base viewBox width = 3.0; zoom = current / 3.0
  const zoom = 3.0 / vb.width;
  svg.querySelectorAll('.orbit-dot').forEach(dot => {
    const baseR = parseFloat(dot.getAttribute('data-base-r'));
    dot.setAttribute('r', (baseR / zoom).toFixed(5));
  });
  svg.querySelectorAll('.loop-arc').forEach(arc => {
    const baseSW = parseFloat(arc.getAttribute('data-base-sw'));
    arc.setAttribute('stroke-width', (baseSW / zoom).toFixed(5));
    // Keep hit targets invisible after resize
    if (arc.classList.contains('gamma-hit')) arc.setAttribute('opacity', '0');
  });
}

// ── UI ─────────────────────────────────────────────────────────────────────
let allT = null;
let didDrag = false;

function parseTheta() {
  const p = parseInt(document.getElementById('theta-p').value.trim());
  const q = parseInt(document.getElementById('theta-q').value.trim());
  if (isNaN(p) || isNaN(q) || q === 0) throw new Error('invalid');
  return rmod1(rat(p, q));
}

function compute() {
  const errEl = document.getElementById('error-msg');
  const statusEl = document.getElementById('status');
  const infoEl = document.getElementById('info-block');
  const gammaEl = document.getElementById('gamma-list');
  errEl.textContent = '';
  statusEl.textContent = 'computing...';
  infoEl.innerHTML = '';
  gammaEl.innerHTML = '';

  let theta;
  try {
    theta = parseTheta();
  } catch (e) {
    errEl.textContent = 'enter integers p and q with q > 0';
    statusEl.textContent = '';
    return;
  }

  if (!rle(ZERO, theta) || !rlt(theta, ONE)) {
    errEl.textContent = 'theta must be in [0, 1)';
    statusEl.textContent = '';
    return;
  }

  if (!allT) {
    statusEl.textContent = 'precomputing intervals...';
    allT = precomputeAllT(20);
  }

  setTimeout(() => {
    try {
      const result = computeGamma(theta, allT);
      if (result.error) {
        errEl.textContent = result.error;
        statusEl.textContent = '';
        return;
      }

      render(result);
      updateDotSizes();

      // Info block
      const totalLoops = result.generations.reduce((s, g) => s + g.length, 0);
      const totalPrime = totalLoops + result.gammaPrime.length;
      const mult = result.multiplicity;
      const multStr = mult < 1000 ? +mult.toFixed(6) : mult.toExponential(4);
      let html = `
        <div class="kv"><span>θ</span><span>${rstr(result.theta)}</span></div>
        <div class="kv"><span>period</span><span>${result.thetaOrbit.length}</span></div>
        <div class="kv"><span>p/q</span><span>${result.p}/${result.q}</span></div>
        <div class="kv"><span>Γ generations</span><span>${result.generations.length}</span></div>
        <div class="kv" style="margin-top:6px;border-top:1px solid var(--border);padding-top:6px;">
          <span style="color:var(--accent)">multiplicity</span>
          <span style="color:var(--accent);font-weight:500">${multStr}</span>
        </div>
      `;

      infoEl.innerHTML = html;

      // Gamma list with weights
      let ghtml = '';
      let wIdx = 0;
      const ws = result.weights || [];
      for (let g = 0; g < result.generations.length; g++) {
        ghtml += `<div class="gen">Γ${g} (${result.generations[g].length} loop${result.generations[g].length !== 1 ? 's' : ''})</div>`;
        for (const loop of result.generations[g]) {
          const w = ws[wIdx] !== undefined ? (+ws[wIdx].toFixed(5)) : '?';
          ghtml += `<div class="loop-row" data-loop-idx="${wIdx}" style="padding-left:8px;color:#4a4a48;display:flex;justify-content:space-between;">
            <span>(${loop.map(rstr).join(', ')})</span>
            <span style="color:#6a9b8a;margin-left:8px;">${w}</span>
          </div>`;
          wIdx++;
        }
      }
      gammaEl.innerHTML = ghtml;

      // Wire up loop highlight: list rows ↔ SVG arcs
      let selectedLoopIdx = null;
      // Reset any previous selection
      if (typeof window._selectLoop === 'function') window._selectLoop = null;
      // Build map: loop key -> index in allGamma
      const loopKeyToIdx = {};
      result.generations.flat().forEach((loop, i) => { loopKeyToIdx[loopKey(loop)] = i; });
      const flatGamma = result.generations.flat();
      const selectedLoopKey = () => {
        if (selectedLoopIdx === null || selectedLoopIdx >= flatGamma.length) return null;
        return loopKey(flatGamma[selectedLoopIdx]);
      };

      function selectLoop(idx) {
        selectedLoopIdx = (selectedLoopIdx === idx) ? null : idx;
        const selKey = selectedLoopKey();
        // Update list rows
        document.querySelectorAll('.loop-row').forEach(row => {
          const i = parseInt(row.dataset.loopIdx);
          row.classList.toggle('loop-selected', i === selectedLoopIdx);
        });
        const svg = document.getElementById('main-svg');
        // Find the pullback keys of the selected loop (keys of its pullbacks in Gamma')
        const pullbackKeys = new Set();
        if (selKey && result.gammaPrimeAll) {
          for (const entry of result.gammaPrimeAll) {
            if (entry.srcKey === selKey) pullbackKeys.add(entry.key);
          }
        }
        // Update Gamma arcs
        svg.querySelectorAll('.gamma-arc').forEach(arc => {
          if (arc.classList.contains('gamma-hit')) return;
          const i = parseInt(arc.getAttribute('data-loop-idx'));
          const arcKey = arc.getAttribute('data-loop-key');
          if (selectedLoopIdx === null) {
            arc.style.opacity = '';
            arc.style.stroke = '';
          } else if (i === selectedLoopIdx) {
            arc.style.opacity = '1';
            arc.style.stroke = '';
          } else if (pullbackKeys.has(arcKey)) {
            // Pullback that is in Gamma: show in Gamma' color
            arc.style.opacity = '0.9';
            arc.style.stroke = '#c47a3a';
          } else {
            arc.style.opacity = '0.12';
            arc.style.stroke = '';
          }
        });
        // Update Gamma' arcs: highlight pullbacks of selected loop, dim others
        svg.querySelectorAll('.prime-arc').forEach(arc => {
          if (selectedLoopIdx === null) {
            arc.style.opacity = '';
            arc.style.stroke = '';
          } else {
            const arcSrc = arc.getAttribute('data-src-key');
            const isPullback = (arcSrc === selKey);
            arc.style.opacity = isPullback ? '0.9' : '0.07';
            arc.style.stroke = isPullback ? '#c47a3a' : '';
          }
        });
        // Scroll list row into view
        if (selectedLoopIdx !== null) {
          const row = document.querySelector(`.loop-row[data-loop-idx="${selectedLoopIdx}"]`);
          if (row) row.scrollIntoView({ block: 'nearest' });
        }
      }
      // Expose globally for the pan/zoom pointerup handler
      window._selectLoop = selectLoop;

      // Click on list rows (delegated)
      gammaEl.addEventListener('click', e => {
        const row = e.target.closest('.loop-row');
        if (!row) return;
        selectLoop(parseInt(row.dataset.loopIdx));
      });

      // Matrix display
      const M = result.matrix;
      const nG = M ? M.length : 0;
      if (M && nG > 0) {
        const allLoops = result.generations.flat();
        // Short labels for rows/cols: loop index
        let mhtml = `<div class="section-title" style="font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:3px;margin:10px 0 6px;">Matrix M</div>`;
        mhtml += `<div style="overflow-x:auto;font-size:10px;font-family:'Courier New',monospace;">`;
        mhtml += `<table style="border-collapse:collapse;color:var(--muted);">`;
        // Header row
        mhtml += `<tr><td style="padding:1px 4px;"></td>`;
        for (let j = 0; j < nG; j++) mhtml += `<td style="padding:1px 4px;text-align:center;color:#6a9b8a;">${j+1}</td>`;
        mhtml += `</tr>`;
        // Data rows
        for (let i = 0; i < nG; i++) {
          mhtml += `<tr><td style="padding:1px 4px;color:#6a9b8a;">${i+1}</td>`;
          for (let j = 0; j < nG; j++) {
            const v = M[i][j];
            const s = v === 0 ? '·' : (Number.isInteger(v) ? v : +v.toFixed(3));
            const col = v !== 0 ? 'color:var(--text)' : '';
            mhtml += `<td style="padding:1px 4px;text-align:center;${col}">${s}</td>`;
          }
          mhtml += `</tr>`;
        }
        mhtml += `</table></div>`;

        gammaEl.innerHTML += mhtml;
      }

      statusEl.textContent = `done — ${result.generations.length} generation(s)`;
    } catch (e) {
      errEl.textContent = 'computation error: ' + e.message;
      statusEl.textContent = '';
      console.error(e);
    }
  }, 10);
}

// ── Zoom / pan ────────────────────────────────────────────────────────────
(function() {
  let scale = 1, tx = 0, ty = 0;
  let dragging = false, lastX = 0, lastY = 0;

  function applyTransform() {
    const vx = -1.5 / scale - tx / scale;
    const vy = -1.5 / scale - ty / scale;
    const vs = 3 / scale;
    document.getElementById('main-svg').setAttribute('viewBox', `${-1.5 + (-tx/scale)*3} ${-1.5 + (-ty/scale)*3} ${3/scale} ${3/scale}`);
  }

  function clampedViewBox(cx, cy, s) {
    // cx, cy are center in SVG coords, s is the full view width
    const half = s / 2;
    return { minX: cx - half, minY: cy - half, size: s };
  }

  window.zoomBy = function(factor) {
    const svg = document.getElementById('main-svg');
    const vb = svg.viewBox.baseVal;
    const cx = vb.x + vb.width / 2;
    const cy = vb.y + vb.height / 2;
    const newSize = Math.max(0.2, Math.min(6, vb.width / factor));
    svg.setAttribute('viewBox', `${cx - newSize/2} ${cy - newSize/2} ${newSize} ${newSize}`);
    updateDotSizes();
  };

  window.zoomReset = function() {
    document.getElementById('main-svg').setAttribute('viewBox', '-1.5 -1.5 3 3');
    updateDotSizes();
  };

  window.addEventListener('load', () => {
    const wrapper = document.getElementById('svg-wrapper');
    const svg = document.getElementById('main-svg');

    // Wheel zoom
    wrapper.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
      // zoom toward mouse position
      const rect = svg.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width;
      const my = (e.clientY - rect.top) / rect.height;
      const vb = svg.viewBox.baseVal;
      const svgX = vb.x + mx * vb.width;
      const svgY = vb.y + my * vb.height;
      const newSize = Math.max(0.2, Math.min(6, vb.width / factor));
      const newX = svgX - mx * newSize;
      const newY = svgY - my * newSize;
      svg.setAttribute('viewBox', `${newX} ${newY} ${newSize} ${newSize}`);
      updateDotSizes();
    }, { passive: false });

    // Pan
    wrapper.addEventListener('pointerdown', e => {
      dragging = true; didDrag = false; lastX = e.clientX; lastY = e.clientY;
      wrapper.setPointerCapture(e.pointerId);
    });
    wrapper.addEventListener('pointermove', e => {
      if (!dragging) return;
      const rawDx = e.clientX - lastX, rawDy = e.clientY - lastY;
      if (Math.abs(rawDx) + Math.abs(rawDy) > 3) didDrag = true;
      const vb = svg.viewBox.baseVal;
      const rect = svg.getBoundingClientRect();
      const dx = rawDx / rect.width * vb.width;
      const dy = rawDy / rect.height * vb.height;
      svg.setAttribute('viewBox', `${vb.x - dx} ${vb.y - dy} ${vb.width} ${vb.height}`);
      lastX = e.clientX; lastY = e.clientY;
      updateDotSizes();
    });
    wrapper.addEventListener('pointerup', e => {
      dragging = false;
      if (!didDrag) {
        // It's a tap/click — find what's under the pointer
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const arc = el && el.closest('.gamma-arc');
        // Dispatch to the global selectLoop if it's defined
        if (typeof window._selectLoop === 'function') {
          window._selectLoop(arc ? parseInt(arc.getAttribute('data-loop-idx')) : null);
        }
      }
    });
  });
})();

// initial render
window.addEventListener('load', () => {
  allT = precomputeAllT(20);
  // pressing Enter in either input box triggers compute
  ['theta-p', 'theta-q'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') compute();
    });
  });
  // E92 copy: open on the angle given in the URL, #p=..&q=.. (used by per6_live.html), and follow changes
  const fromHash = () => { const m = location.hash.match(/p=(\d+)&q=(\d+)/);
    if (m) { document.getElementById('theta-p').value = m[1]; document.getElementById('theta-q').value = m[2]; } };
  fromHash();
  window.addEventListener('hashchange', () => { fromHash(); compute(); });
  compute();
});
