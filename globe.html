<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>3D view</title>
<style>
  html, body { margin:0; height:100%; font:13px/1.4 -apple-system, system-ui, sans-serif; color:#2b2b2b; background:#1a1a1a; overflow:hidden; }
  #gc { position:absolute; inset:0; width:100%; height:100%; cursor:grab; display:block; }
  #panel { position:absolute; top:8px; left:8px; max-width:340px; background:rgba(250,250,248,.94); border:1px solid #ccc; border-radius:6px; padding:7px 10px; font-size:12px; }
  #panel h1 { font-size:13.5px; margin:0 0 3px; } #panel .sub { color:#666; } button { font:inherit; padding:1px 7px; border:1px solid #bbb; background:#fff; border-radius:4px; cursor:pointer; }
  #panel.min .body { display:none; } #minb { float:right; margin-left:6px; }
</style></head>
<body>
<canvas id="gc"></canvas>
<div id="panel"><button id="minb" title="hide / show">–</button><h1 id="title">3D view</h1>
  <div class="body"><div class="sub" id="about"></div>
  <div style="margin-top:5px"><label><input type="checkbox" id="bands" checked> escape-time bands (w)</label> <label><input type="checkbox" id="spin"> rotate slowly</label></div>
  <div style="margin-top:3px">iterations <input type="range" id="it" min="100" max="2000" step="50" value="600" style="width:110px;vertical-align:middle"> <span id="itv">600</span></div>
  <div style="margin-top:4px"><button id="reset">Reset view</button></div>
  <div class="sub" style="margin-top:4px">Drag to rotate, scroll to zoom.</div></div></div>
<script src="js/pern_math.js?v=20261117064117"></script>
<script src="js/glsl.js?v=20261117064117"></script>
<script src="js/globe.js?v=20261117064117"></script>
</body></html>
